<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel RDA | Cast</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --text: #14253b;
      --muted: #5e6e82;
      --line: #d9e2ec;
      --cyan: #0789a8;
      --blue: #3569c8;
      --amber: #a96300;
      --green: #13845e;
      --purple: #7451b8;
      --red: #bf3e48;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body { min-height: 100vh; }

    .app {
      min-height: 100vh;
      padding: 24px 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
    }

    .brand {
      grid-column: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }

    .mark {
      width: 62px;
      height: 62px;
      flex: 0 0 62px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      color: #08233d;
      font-weight: 900;
      font-size: 20px;
      background: linear-gradient(135deg, #72d8e8, #8eafff);
      box-shadow: 0 8px 24px rgba(53,105,200,.16);
    }

    .brand-copy { text-align: center; }

    h1 {
      margin: 0;
      color: #17385f;
      font-size: clamp(30px, 3.4vw, 58px);
      text-shadow: 0 2px 10px rgba(7,137,168,.18);
      font-weight: 850;
      letter-spacing: -.02em;
      line-height: 1.12;
    }

    .subtitle {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: clamp(22px, 2vw, 32px);
      line-height: 1.35;
    }

    .subtitle-company {
      color: #17385f;
      font-weight: 850;
    }

    .subtitle-divider {
      color: #0789a8;
      font-weight: 800;
    }

    .subtitle-area {
      color: #087f91;
      font-weight: 750;
    }

    .right-head {
      grid-column: 3;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }

    .head-tools {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #40536b;
      font-size: 11px;
      letter-spacing: .06em;
      font-weight: 800;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 10px rgba(169,99,0,.45);
    }

    .dot.ok {
      background: var(--green);
      box-shadow: 0 0 10px rgba(19,132,94,.4);
    }

    .datebox {
      min-width: 130px;
      text-align: right;
    }

    .time {
      font-size: clamp(20px, 1.8vw, 29px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #17385f;
    }

    .date {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      text-transform: capitalize;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid #d5dfeb;
      border-radius: 9px;
      padding: 9px 12px;
      color: #172b45;
      background: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(20,37,59,.06);
    }

    .btn:hover { background: #eaf1f8; }

    .btn:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 2px;
    }

    .btn:disabled {
      cursor: wait;
      opacity: .7;
    }

    .refresh-status {
      max-width: 250px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      min-height: 78px;
      padding: 14px 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 15px;
      box-shadow: 0 5px 16px rgba(20,43,69,.07);
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .metric-value {
      margin-top: 3px;
      font-size: 27px;
      line-height: 1;
      font-weight: 850;
    }

    .metric-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: #eef3f8;
      font-size: 18px;
      font-weight: 800;
    }

    .board {
    flex: 1;
    min-height: 320px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

    .column {
      min-height: 0;
      padding: 13px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(20,43,69,.07);
    }

    .column-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 2px 2px 11px;
      margin-bottom: 10px;
      border-bottom: 1px solid #e1e7ef;
    }

    .column-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #0b1f36;
      font-size: clamp(16px, 1.45vw, 22px);
      font-weight: 900;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .column-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
    }

    .count {
      padding: 4px 8px;
      color: #34465d;
      background: #edf2f7;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
    }

    .cards {
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding-right: 2px;
    }

    .cards::-webkit-scrollbar { width: 5px; }
    .cards::-webkit-scrollbar-thumb { background: #aebdce; border-radius: 10px; }

    .task {
      --stage-color: #3569c8;
      padding: 12px 13px;
      background: #fff;
      border: 1px solid #d9e2ec;
      border-left: 4px solid var(--stage-color);
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(20,37,59,.06);
    }

    .task.stage-informacao { --stage-color: #0789a8; }
    .task.stage-plano { --stage-color: #3569c8; }
    .task.stage-acao { --stage-color: #a96300; }
    .task.stage-medicao { --stage-color: #7451b8; }
    .task.stage-concluido { --stage-color: #13845e; }

        .task.stage-medicao .task-top,
        .task.stage-medicao .task-title-label,
        .task.stage-medicao .task-meta { display: none; }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .id {
      color: #607187;
      font-size: 10px;
      letter-spacing: .08em;
      font-weight: 850;
    }

    .priority {
      padding: 4px 7px;
      border-radius: 99px;
      font-size: 9px;
      letter-spacing: .06em;
      font-weight: 850;
      white-space: nowrap;
    }

    .p-high { color: #a52f3a; background: #fdebed; }
    .p-med { color: #895000; background: #fff2d9; }
    .p-low { color: #2858a9; background: #eaf1ff; }

    .task-title-label {
      margin: 2px 0 4px;
      color: #607187;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .08em;
    }

    .task h3.task-title {
      margin: 0 0 10px;
      padding: 9px 10px;
      color: #14253b;
      background: #f1f5fa;
      border-left: 3px solid var(--stage-color);
      border-radius: 8px;
      font-size: clamp(14px, 1.05vw, 17px);
      line-height: 1.3;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .desc {
      margin: 0 0 9px;
      color: #43546a;
      font-size: clamp(16px, 1.3vw, 24px);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .task-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      padding-top: 8px;
      border-top: 1px solid #e4eaf1;
    }

    .meta-label {
      margin-bottom: 3px;
      color: #607187;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .meta-value {
      color: #23364d;
      font-size: clamp(10px, .76vw, 12px);
      font-weight: 750;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .kpi {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
      padding: 7px 8px;
      background: #f1f5fa;
      border-radius: 8px;
    }

    .kpi span:first-child {
      color: #52647b;
      font-size: 10px;
      font-weight: 800;
    }

    .kpi strong {
      color: var(--cyan);
      font-size: 11px;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 25px 12px;
      color: #63748a;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    .completed-section {
      grid-column: 1 / -1;
      padding: 15px;
      background: #f5fbf8;
      border: 1px solid #b9dfce;
      border-top: 4px solid var(--green);
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(20, 43, 69, .07);
    }

    .completed-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #d5e9df;
      color: #126746;
      font-size: 16px;
      font-weight: 850;
    }

    .completed-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 99px;
      color: #126746;
      background: #dff3e9;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .error-panel {
      grid-column: 1 / -1;
      padding: 18px;
      color: #8d2630;
      background: #fff1f2;
      border: 1px solid #f1c6ca;
      border-radius: 12px;
      line-height: 1.6;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #5b6b80;
      font-size: 11px;
    }

    .cycle {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .cycle b { color: #263f5c; }
    .sep { color: #8292a6; }

    .tag {
      padding: 5px 9px;
      color: #53657c;
      background: #fff;
      border: 1px solid #d5dfeb;
      border-radius: 99px;
    }

    @media (min-width: 901px) and (max-width: 1250px) {
      .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .topbar { grid-template-columns: 1fr; }
      .brand, .right-head { grid-column: 1; }
      .right-head { justify-content: center; }
      .head-tools { align-items: center; }
      .refresh-status { text-align: center; }
    }

    @media (max-width: 900px) {
      .app { padding: 18px; }
      .topbar { grid-template-columns: 1fr; }
      .brand, .right-head { grid-column: 1; }
      .right-head { justify-content: center; flex-wrap: wrap; }
      .head-tools { align-items: center; }
      .controls { justify-content: center; }
      .refresh-status { text-align: center; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .column { min-height: 280px; }
      .datebox { min-width: auto; text-align: center; }
    }

    @media (max-width: 600px) {
      .app { padding: 14px; gap: 15px; }
      .brand { gap: 11px; }
      .mark { width: 50px; height: 50px; flex-basis: 50px; border-radius: 14px; font-size: 17px; }
      .subtitle { gap: 5px; font-size: 14px; }
      .summary { gap: 8px; }
      .metric { padding: 11px; }
      .metric-label { font-size: 11px; }
      .metric-value { font-size: 23px; }
      .board { grid-template-columns: 1fr; }
      .column { min-height: 220px; }
      .footer { align-items: flex-start; flex-direction: column; }
    }
    h1 {
      font-size: clamp(40px, 4.4vw, 76px) !important;
      font-weight: 900 !important;
      line-height: 1.05 !important;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">RDA</div>
        <div class="brand-copy">
          <h1>Painel de Alinhamento</h1>
          <div class="subtitle">
            <span class="subtitle-company">CAST Móveis Planejados</span>
            <span class="subtitle-divider">•</span>
            <span class="subtitle-area">Logística e Operações</span>
          </div>
        </div>
      </div>

      <div class="right-head">
        <div class="head-tools">
          <div class="live" id="connectionStatus">
            <span class="dot"></span> CONECTANDO À PLANILHA
          </div>
          <div class="controls">
            <button class="btn" id="fullscreenButton" type="button" aria-label="Ativar tela cheia">⛶ Tela cheia</button>
            <button class="btn" id="refreshButton" type="button">↻ Atualizar agora</button>
          </div>
          <div class="refresh-status" id="refreshStatus">Carregando dados publicados…</div>
        </div>
        <div class="datebox">
          <div class="time" id="clock">--:--</div>
          <div class="date" id="today">--</div>
        </div>
      </div>
    </header>

    <section class="summary" id="summary"></section>

    <main class="board" id="board">
      <section class="column" style="grid-column:1/-1">
        <div class="empty">Conectando à planilha publicada…</div>
      </section>
    </main>

    <footer class="footer">
      <div class="cycle">
        <span><b>RDA</b></span><span class="sep">›</span>
        <span>Informação</span><span class="sep">›</span>
        <span>Plano</span><span class="sep">›</span>
        <span>Ação</span><span class="sep">›</span>
        <span>Resultado</span>
      </div>
      <div class="tag">ABA CONECTADA: gid=200264193 • ATUALIZAÇÃO AUTOMÁTICA A CADA 30s</div>
    </footer>
  </div>

  <script>
    const spreadsheetId = "1cByWoCJKlqKHMx2G_WmBwWw4Lex0GTF-";
    const publishedId = "2PACX-1vSDAeLf45g7bTRDTxoIEncgQTr9Kbl1psirCjljempk461yfVCO2XZWMm0I-Vv5_A";
    const sheetGid = "200264193";

    const stages = [
      { id: "informacao", title: "Informação", color: "#0789a8" },
      { id: "plano", title: "Plano definido", color: "#3569c8" },
      { id: "acao", title: "Em execução", color: "#a96300" },
      { id: "medicao", title: "Medindo resultado", color: "#7451b8" },
      { id: "concluido", title: "Concluído", color: "#13845e" }
    ];

    let plans = [];
    let requestNumber = 0;
    let dataLoaded = false;

    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char]));

    const normalize = value => String(value ?? "")
      .replace(/^\uFEFF/, "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toUpperCase()
      .replace(/[^A-Z0-9]+/g, " ")
      .trim();

    const priorityClass = value => {
      const priority = normalize(value);
      return priority === "ALTA" ? "p-high" : priority === "MEDIA" ? "p-med" : "p-low";
    };

    function inferStage(plan) {
      const result = normalize(plan.resultado);

      if (
        result.includes("CONCLUIDO") ||
        result.includes("FINALIZADO") ||
        result.includes("EXECUTADO") ||
        result.includes("ENCERRADO")
      ) return "concluido";

      if (result) return "medicao";
      if (plan.acao) return "acao";
      if (plan.titulo) return "plano";
      return "informacao";
    }

    function hasStageData(plan, stageId) {
      if (stageId === "informacao") return Boolean(plan.informacao);
      if (stageId === "plano") return Boolean(plan.titulo);
      if (stageId === "acao") return Boolean(plan.acao);
      if (stageId === "medicao") return Boolean(plan.resultado);
      return false;
    }

    function loadPlans(csvRows) {
      if (!Array.isArray(csvRows) || csvRows.length < 1) {
        throw new Error("A planilha publicada não retornou linhas para leitura.");
      }

      const headers = csvRows[0].map(value => normalize(value));
      const findColumn = aliases =>
        headers.findIndex(header => aliases.some(alias => header === normalize(alias)));

      const positions = {
        informacao: findColumn(["INFORMAÇÃO", "INFORMACAO"]),
        titulo: findColumn(["TÍTULO DO PLANO", "TITULO DO PLANO", "TÍTULO", "TITULO"]),
        acao: findColumn([
          "DESCRIÇÃO / AÇÃO PLANEJADA",
          "DESCRICAO / ACAO PLANEJADA",
          "DESCRIÇÃO ACAO PLANEJADA",
          "DESCRICAO ACAO PLANEJADA",
          "AÇÃO PLANEJADA",
          "ACAO PLANEJADA"
        ]),
        responsavel: findColumn(["RESPONSÁVEL", "RESPONSAVEL"]),
        prazo: findColumn(["PRAZO"]),
        prioridade: findColumn(["PRIORIDADE"]),
        resultado: findColumn(["RESULTADO"])
      };

      const missing = Object.entries(positions)
        .filter(([, index]) => index < 0)
        .map(([key]) => key);

      if (missing.length) {
        throw new Error(
          "Não encontrei os cabeçalhos necessários. Cabeçalhos recebidos: " +
          csvRows[0].join(" | ")
        );
      }

      const valueAt = (row, index) => String(row[index] ?? "").trim();

      return csvRows.slice(1).map((row, index) => {
        const plan = {
          id: `RDA-${String(index + 1).padStart(3, "0")}`,
          informacao: valueAt(row, positions.informacao),
          titulo: valueAt(row, positions.titulo),
          acao: valueAt(row, positions.acao),
          responsavel: valueAt(row, positions.responsavel),
          prazo: valueAt(row, positions.prazo),
          prioridade: valueAt(row, positions.prioridade),
          resultado: valueAt(row, positions.resultado)
        };
        plan.stage = inferStage(plan);
        return plan;
      }).filter(plan => [
        plan.informacao,
        plan.titulo,
        plan.acao,
        plan.responsavel,
        plan.prazo,
        plan.prioridade,
        plan.resultado
      ].some(value => value !== ""));
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '"' && quoted && text[i + 1] === '"') {
          field += '"';
          i++;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(field);
          field = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && text[i + 1] === "\n") i++;
          row.push(field);
          if (row.some(cell => cell.trim() !== "")) rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }

      row.push(field);
      if (row.some(cell => cell.trim() !== "")) rows.push(row);
      return rows;
    }

    function renderSummary() {
      const open = plans.filter(plan => plan.stage !== "concluido").length;
      const running = plans.filter(plan => plan.stage === "acao").length;
      const measuring = plans.filter(plan => plan.stage === "medicao").length;
      const done = plans.filter(plan => plan.stage === "concluido").length;

      const metrics = [
        ["Planos em acompanhamento", open, "◉", "#0789a8"],
        ["Concluídos", done, "✓", "#13845e"]
      ];

      document.getElementById("summary").innerHTML = metrics.map(metric =>
        `<div class="metric">
          <div>
            <div class="metric-label">${metric[0]}</div>
            <div class="metric-value" style="color:${metric[3]}">${dataLoaded ? metric[1] : "—"}</div>
          </div>
          <div class="metric-icon" style="color:${metric[3]}">${metric[2]}</div>
        </div>`
      ).join("");
    }

    function renderBoard(message = "", isError = false) {
      const board = document.getElementById("board");

      if (message && isError) {
        board.innerHTML = `<section class="error-panel">
          <strong>Não foi possível sincronizar os dados agora.</strong><br>
          ${escapeHtml(message)}
          <br>Confira a publicação da aba e use “Atualizar agora” para tentar novamente.
        </section>`;
        return;
      }

      if (message) {
        board.innerHTML = `<section class="column" style="grid-column:1/-1">
          <div class="empty">${escapeHtml(message)}</div>
        </section>`;
        return;
      }

      if (!plans.length) {
        board.innerHTML = `<section class="column" style="grid-column:1/-1">
          <div class="empty">A planilha foi lida, mas não há planos preenchidos nesta aba.</div>
        </section>`;
        return;
      }

      const activeStages = stages.filter(stage => stage.id !== "concluido");
      const completedPlans = plans.filter(plan => plan.stage === "concluido");

      const activeBoard = activeStages.map(stage => {
        const items = plans.filter(plan =>
          plan.stage !== "concluido" && hasStageData(plan, stage.id)
        );

        const cards = items.length ? items.map(plan => {
          let stageContent = "";

          if (stage.id === "informacao") {
            stageContent = `
              <div class="task-title-label">INFORMAÇÃO</div>
              <p class="desc">${escapeHtml(plan.informacao || "Não informado")}</p>`;
          } else if (stage.id === "plano") {
            stageContent = `
              <div class="task-title-label">PLANO DEFINIDO</div>
              <h3 class="task-title">${escapeHtml(plan.titulo || "Sem título")}</h3>`;
          } else if (stage.id === "acao") {
            stageContent = `
              <div class="task-title-label">EM EXECUÇÃO • AÇÃO PLANEJADA</div>
              <p class="desc">${escapeHtml(plan.acao || "Não informado")}</p>`;
          } else {
            stageContent = `
              <div class="task-title-label">MEDINDO RESULTADOS</div>
              <p class="desc"><strong>Resultado:</strong> ${escapeHtml(plan.resultado || "Aguardando registro do resultado")}</p>
                  <p class="desc"><strong>Ação em execução:</strong> ${escapeHtml(plan.acao || "Não informado")}</p>`;
          }

          return `
            <article class="task stage-${plan.stage}">
              <div class="task-top">
                <span class="id">${escapeHtml(plan.id)}</span>
                <span class="priority ${priorityClass(plan.prioridade)}">
                  ${escapeHtml(plan.prioridade || "SEM PRIORIDADE")}
                </span>
              </div>
              ${stageContent}
              <div class="task-meta">
                <div>
                  <div class="meta-label">Responsável</div>
                  <div class="meta-value">${escapeHtml(plan.responsavel || "Não informado")}</div>
                </div>
                <div>
                  <div class="meta-label">Prazo</div>
                  <div class="meta-value">${escapeHtml(plan.prazo || "Não informado")}</div>
                </div>
              </div>
            </article>`;
        }).join("") : '<div class="empty">Nenhum plano nesta etapa.</div>';

        return `<section class="column">
          <div class="column-head">
            <div class="column-title">
              <span class="column-dot" style="background:${stage.color};box-shadow:0 0 10px ${stage.color}66"></span>
              ${stage.title}
            </div>
            <span class="count">${items.length}</span>
          </div>
          <div class="cards">${cards}</div>
        </section>`;
      }).join("");

      const completedCards = completedPlans.length ? completedPlans.map(plan => `
        <article class="task stage-concluido">
          <div class="task-top">
            <span class="id">${escapeHtml(plan.id)}</span>
            <span class="status-badge">CONCLUÍDO</span>
            <span class="priority ${priorityClass(plan.prioridade)}">
              ${escapeHtml(plan.prioridade || "SEM PRIORIDADE")}
            </span>
          </div>
          <div class="task-title-label">TÍTULO DO PLANO</div>
          <h3 class="task-title">${escapeHtml(plan.titulo || "Sem título")}</h3>
          <p class="desc"><strong>INFORMAÇÃO:</strong> ${escapeHtml(plan.informacao || "Não informado")}</p>
          <p class="desc"><strong>Descrição / ação planejada:</strong> ${escapeHtml(plan.acao || "Não informado")}</p>
          <div class="task-meta">
            <div>
              <div class="meta-label">Responsável</div>
              <div class="meta-value">${escapeHtml(plan.responsavel || "Não informado")}</div>
            </div>
            <div>
              <div class="meta-label">Prazo</div>
              <div class="meta-value">${escapeHtml(plan.prazo || "Não informado")}</div>
            </div>
            <div class="kpi">
              <span>RESULTADO</span>
              <strong>${escapeHtml(plan.resultado || "Concluído")}</strong>
            </div>
          </div>
        </article>
      `).join("") : '<div class="empty">Nenhum plano concluído.</div>';

      board.innerHTML = `${activeBoard}
        <section class="completed-section">
          <div class="completed-head">
            <span>Planos concluídos</span>
            <span class="count">${completedPlans.length}</span>
          </div>
          <div class="completed-cards">${completedCards}</div>
        </section>`;
    }

    function setConnection(message, connected) {
      const status = document.getElementById("connectionStatus");
      status.innerHTML =
        `<span class="dot${connected ? " ok" : ""}"></span> ${escapeHtml(message)}`;
    }

    async function loadPublishedTable() {
      const csvUrl =
        `https://docs.google.com/spreadsheets/d/e/${publishedId}/pub?gid=${sheetGid}&single=true&output=csv&cache=${Date.now()}`;

      try {
        const response = await fetch(csvUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`O Google respondeu com status ${response.status}.`);
        }

        const text = await response.text();
        if (!text || text.trim().startsWith("<!DOCTYPE") || text.trim().startsWith("<html")) {
          throw new Error("O Google não retornou o CSV publicado da aba.");
        }

        const rows = parseCsv(text);
        if (!rows.length) throw new Error("O CSV publicado veio vazio.");
        return rows;
      } catch (csvError) {
        return await loadGvizFallback(csvError);
      }
    }

    function loadGvizFallback(previousError) {
      return new Promise((resolve, reject) => {
        const callbackName =
          `rdaCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
        const script = document.createElement("script");
        let settled = false;

        const timeout = setTimeout(() => {
          finish(new Error("A leitura CSV e a alternativa Google Sheets falharam."));
        }, 15000);

        function finish(error, data) {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          script.remove();
          delete window[callbackName];

          if (error) {
            reject(new Error(`${error.message} Detalhe CSV: ${previousError.message}`));
            return;
          }

          const table = data && data.table;
          if (!table || !Array.isArray(table.cols) || !Array.isArray(table.rows)) {
            reject(new Error("O Google não retornou uma tabela de dados."));
            return;
          }

          let headers = table.cols.map((column, index) =>
            column.label || column.id || `COLUNA ${index + 1}`
          );

          let body = table.rows.map(row => table.cols.map((_, index) => {
            const cell = row.c && row.c[index];
            return cell ? String(cell.f ?? cell.v ?? "").trim() : "";
          }));

          const normalizedHeaders = headers.map(normalize);
          const requiredHeaders = [
            "INFORMACAO", "RESPONSAVEL", "PRAZO", "PRIORIDADE", "RESULTADO"
          ];
          const headersAreUsable =
            requiredHeaders.every(header => normalizedHeaders.includes(header));

          if (!headersAreUsable && body.length) {
            const firstRowHeaders = body[0].map(normalize);
            const firstRowHasHeaders =
              requiredHeaders.every(header => firstRowHeaders.includes(header));
            if (firstRowHasHeaders) headers = body.shift();
          }

          resolve([headers, ...body]);
        }

        window[callbackName] = data => {
          if (!data || (data.errors && data.errors.length)) {
            finish(new Error("A alternativa do Google Sheets não conseguiu ler a aba publicada."));
            return;
          }
          finish(null, data);
        };

        script.onerror = () =>
          finish(new Error("Não foi possível carregar os dados da planilha."));

        const endpoint =
          new URL(`https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq`);
        endpoint.searchParams.set("gid", sheetGid);
        endpoint.searchParams.set("headers", "1");
        endpoint.searchParams.set("tqx", `out:json;responseHandler:${callbackName}`);
        endpoint.searchParams.set("_", String(Date.now()));
        script.src = endpoint.toString();
        document.head.appendChild(script);
      });
    }

    async function refreshPlans() {
      const currentRequest = ++requestNumber;
      const button = document.getElementById("refreshButton");
      button.disabled = true;
      button.textContent = "↻ Carregando…";
      setConnection("CONECTANDO À PLANILHA", false);
      document.getElementById("refreshStatus").textContent =
        "Consultando a aba publicada…";

      try {
        const rows = await loadPublishedTable();
        if (currentRequest !== requestNumber) return;

        plans = loadPlans(rows);
        dataLoaded = true;
        renderSummary();
        renderBoard();
        setConnection("PLANILHA CONECTADA", true);

        const now = new Intl.DateTimeFormat("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }).format(new Date());

        document.getElementById("refreshStatus").textContent =
          `Dados atualizados às ${now} • ${plans.length} plano(s) lido(s)`;
      } catch (error) {
        if (currentRequest !== requestNumber) return;

        dataLoaded = false;
        renderSummary();
        setConnection("FALHA NA CONEXÃO", false);
        document.getElementById("refreshStatus").textContent =
          "Atualização falhou. Tente novamente pelo botão.";

        renderBoard(
          `Não foi possível carregar os dados da planilha. ${error.message} Confira se a publicação está ativa e se a aba publicada é a de gid=${sheetGid}.`,
          true
        );
      } finally {
        if (currentRequest === requestNumber) {
          button.disabled = false;
          button.textContent = "↻ Atualizar agora";
        }
      }
    }

    function updateClock() {
      const now = new Date();

      document.getElementById("clock").textContent =
        new Intl.DateTimeFormat("pt-BR", {
          hour: "2-digit",
          minute: "2-digit"
        }).format(now);

      document.getElementById("today").textContent =
        new Intl.DateTimeFormat("pt-BR", {
          weekday: "long",
          day: "2-digit",
          month: "long",
          year: "numeric"
        }).format(now);
    }

    const fullscreenButton = document.getElementById("fullscreenButton");

    function updateFullscreenButton() {
      const isFullscreen = Boolean(
        document.fullscreenElement || document.webkitFullscreenElement
      );
      fullscreenButton.textContent =
        isFullscreen ? "⛶ Sair da tela cheia" : "⛶ Tela cheia";
      fullscreenButton.setAttribute(
        "aria-label",
        isFullscreen ? "Sair da tela cheia" : "Ativar tela cheia"
      );
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          return;
        }

        const page = document.documentElement;
        if (page.requestFullscreen) {
          await page.requestFullscreen();
        } else if (page.webkitRequestFullscreen) {
          page.webkitRequestFullscreen();
        } else {
          fullscreenButton.textContent = "Tela cheia indisponível";
          setTimeout(updateFullscreenButton, 2000);
        }
      } catch (error) {
        fullscreenButton.textContent = "Tela cheia bloqueada";
        setTimeout(updateFullscreenButton, 2000);
      }
    }

    fullscreenButton.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

    document.getElementById("refreshButton")
      .addEventListener("click", refreshPlans);

    renderSummary();
    updateClock();
    refreshPlans();

    setInterval(refreshPlans, 30000);
    setInterval(updateClock, 30000);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshPlans();
    });
  </script>
</body>
</html>
